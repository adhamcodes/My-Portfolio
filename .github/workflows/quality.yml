name: Portfolio Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, smoke, and visual surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/adham-portfolio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/adham-portfolio-server.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/work/zeroupload > /dev/null
          QUIET_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/work/quiet)"
          if [ "$QUIET_STATUS" != "404" ]; then
            echo "Quiet launch gate expected HTTP 404, received $QUIET_STATUS." >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/api/living-state > /tmp/living-state.json

          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('/tmp/living-state.json', 'utf8'));
          const valid = state
            && Number.isFinite(state.schemaVersion)
            && typeof state.generatedAt === 'string'
            && Array.isArray(state.focus)
            && Array.isArray(state.growth)
            && Array.isArray(state.work)
            && Array.isArray(state.events);
          if (!valid) {
            console.error('Living-state API returned an invalid public schema.');
            process.exit(1);
          }
          if (state.work.some((work) => work?.id === 'quiet')) {
            console.error('Quiet entered public Living State before its launch gate passed.');
            process.exit(1);
          }
          console.log(`Living-state schema ${state.schemaVersion}: ${state.events.length} public events`);
          NODE

          if ! grep -q 'mailto:adham.mahmood.work@gmail.com' /tmp/home.html; then
            echo 'Final professional contact email is missing from the rendered home page.' >&2
            exit 1
          fi

      - name: Capture production review surfaces
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No headless Chromium binary is available on this runner.' >&2
            exit 1
          fi

          npm run start -- -p 3000 > /tmp/adham-portfolio-visual-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          mkdir -p artifacts/visual-review
          FLAGS=(--headless=new --no-sandbox --hide-scrollbars --run-all-compositor-stages-before-draw --disable-background-timer-throttling --virtual-time-budget=6500 --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader)

          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/home-desktop.png http://127.0.0.1:3000/
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/index-desktop.png 'http://127.0.0.1:3000/?review=index'
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/now-desktop.png 'http://127.0.0.1:3000/#now'
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/work-desktop.png 'http://127.0.0.1:3000/#work'
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/growth-desktop.png 'http://127.0.0.1:3000/#growth'
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/history-desktop.png 'http://127.0.0.1:3000/#history'
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/present-desktop.png 'http://127.0.0.1:3000/#present'
          "$BROWSER" "${FLAGS[@]}" --window-size=1600,1000 --screenshot=artifacts/visual-review/zeroupload-desktop.png http://127.0.0.1:3000/work/zeroupload

          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/home-mobile.png http://127.0.0.1:3000/
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/index-mobile.png 'http://127.0.0.1:3000/?review=index'
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/now-mobile.png 'http://127.0.0.1:3000/#now'
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/work-mobile.png 'http://127.0.0.1:3000/#work'
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/growth-mobile.png 'http://127.0.0.1:3000/#growth'
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/history-mobile.png 'http://127.0.0.1:3000/#history'
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/present-mobile.png 'http://127.0.0.1:3000/#present'
          "$BROWSER" "${FLAGS[@]}" --window-size=390,844 --force-device-scale-factor=1 --screenshot=artifacts/visual-review/zeroupload-mobile.png http://127.0.0.1:3000/work/zeroupload

      - name: Upload visual review surfaces
        uses: actions/upload-artifact@v4
        with:
          name: master-2-visual-review
          path: artifacts/visual-review
          if-no-files-found: error
          retention-days: 7
