name: Portfolio Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, smoke, and visual surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/adham-portfolio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/adham-portfolio-server.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/work/zeroupload > /dev/null
          QUIET_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/work/quiet)"
          if [ "$QUIET_STATUS" != "404" ]; then
            echo "Quiet launch gate expected HTTP 404, received $QUIET_STATUS." >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/api/living-state > /tmp/living-state.json

          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('/tmp/living-state.json', 'utf8'));
          const valid = state
            && Number.isFinite(state.schemaVersion)
            && typeof state.generatedAt === 'string'
            && Array.isArray(state.focus)
            && Array.isArray(state.growth)
            && Array.isArray(state.work)
            && Array.isArray(state.events);
          if (!valid) {
            console.error('Living-state API returned an invalid public schema.');
            process.exit(1);
          }
          if (state.work.some((work) => work?.id === 'quiet')) {
            console.error('Quiet entered public Living State before its launch gate passed.');
            process.exit(1);
          }
          console.log(`Living-state schema ${state.schemaVersion}: ${state.events.length} public events`);
          NODE

          if ! grep -q 'mailto:adham.mahmood.work@gmail.com' /tmp/home.html; then
            echo 'Final professional contact email is missing from the rendered home page.' >&2
            exit 1
          fi

      - name: Capture and certify production review surfaces
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No headless Chromium binary is available on this runner.' >&2
            exit 1
          fi

          npm run start -- -p 3000 > /tmp/adham-portfolio-visual-server.log 2>&1 &
          SERVER_PID=$!
          CHROME_PID=''
          cleanup() {
            if [ -n "$CHROME_PID" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          mkdir -p artifacts/visual-review
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --hide-scrollbars \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --enable-unsafe-swiftshader \
            --use-gl=angle \
            --use-angle=swiftshader \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/adham-portfolio-chrome \
            about:blank > /tmp/adham-portfolio-chrome.log 2>&1 &
          CHROME_PID=$!

          DEBUG_READY=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null 2>&1; then
              DEBUG_READY=1
              break
            fi
            sleep .25
          done
          if [ "$DEBUG_READY" -ne 1 ]; then
            cat /tmp/adham-portfolio-chrome.log
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const origin = 'http://127.0.0.1:3000';
          const output = path.resolve('artifacts/visual-review');
          let nextId = 0;
          const pending = new Map();

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function newTarget() {
            const response = await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' });
            if (!response.ok) throw new Error(`Could not create Chrome target: ${response.status}`);
            return response.json();
          }

          function connect(url) {
            return new Promise((resolve, reject) => {
              const socket = new WebSocket(url);
              socket.addEventListener('open', () => resolve(socket), { once: true });
              socket.addEventListener('error', () => reject(new Error('Chrome DevTools websocket failed to open.')), { once: true });
            });
          }

          function installProtocol(socket) {
            socket.addEventListener('message', (event) => {
              const message = JSON.parse(String(event.data));
              if (!message.id) return;
              const entry = pending.get(message.id);
              if (!entry) return;
              pending.delete(message.id);
              if (message.error) entry.reject(new Error(message.error.message));
              else entry.resolve(message.result ?? {});
            });

            return (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++nextId;
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }

          async function ready(send) {
            await send('Runtime.evaluate', {
              expression: `Promise.all([document.fonts?.ready, new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))])`,
              awaitPromise: true,
              returnByValue: true,
            });
            await sleep(1450);
          }

          async function openIndex(send, label) {
            const result = await send('Runtime.evaluate', {
              expression: `(() => {
                if (document.querySelector('.v4-index-world')) return true;
                const trigger = document.querySelector('.v4-index-trigger');
                if (!trigger) return false;
                trigger.click();
                return true;
              })()`,
              returnByValue: true,
            });
            if (!result.result?.value) throw new Error(`${label} could not open Index.`);
            await sleep(800);
          }

          async function position(send, selector, label) {
            const expression = `(() => {
              const root = document.querySelector(${JSON.stringify(selector)});
              if (!root) return false;
              const target = root.matches('h1,h2,h3,a,button') ? root : (root.querySelector('h1,h2,h3,a,button') || root);
              const rect = target.getBoundingClientRect();
              const top = Math.max(0, window.scrollY + rect.top - window.innerHeight * 0.18);
              window.scrollTo({ top, behavior: 'auto' });
              return true;
            })()`;

            for (let attempt = 0; attempt < 2; attempt += 1) {
              const result = await send('Runtime.evaluate', { expression, returnByValue: true });
              if (!result.result?.value) throw new Error(`${label} target could not be positioned.`);
              await sleep(attempt === 0 ? 500 : 350);
            }
          }

          async function certify(send, selector, label, mustFit) {
            const result = await send('Runtime.evaluate', {
              expression: `(() => {
                const node = document.querySelector(${JSON.stringify(selector)});
                if (!node) return { found: false };
                const subject = node.matches('h1,h2,h3,a,button') ? node : (node.querySelector('h1,h2,h3,a,button') || node);
                const rect = subject.getBoundingClientRect();
                const style = getComputedStyle(subject);
                return {
                  found: true,
                  text: (subject.textContent || '').trim().slice(0, 180),
                  top: rect.top,
                  bottom: rect.bottom,
                  left: rect.left,
                  right: rect.right,
                  opacity: Number(style.opacity || 1),
                  visibility: style.visibility,
                  display: style.display,
                  viewportWidth: innerWidth,
                  viewportHeight: innerHeight,
                  screenWidth: screen.width,
                  screenHeight: screen.height,
                };
              })()`,
              returnByValue: true,
            });
            const view = result.result?.value;
            const intersects = view?.bottom > 0 && view?.top < view?.viewportHeight && view?.right > 0 && view?.left < view?.viewportWidth;
            const visible = view?.found && intersects && view.opacity > 0.01 && view.visibility !== 'hidden' && view.display !== 'none' && view.text;
            const fits = !mustFit || (view.left >= -2 && view.right <= view.screenWidth + 2);
            if (!visible || !fits) throw new Error(`${label} failed visual certification: ${JSON.stringify({ ...view, mustFit, fits })}`);
            console.log(`${label}: ${view.text.replace(/\s+/g, ' ')} @ x ${Math.round(view.left)}..${Math.round(view.right)} / screen ${view.screenWidth}, y ${Math.round(view.top)}..${Math.round(view.bottom)}`);
          }

          async function capture(send, name, url, viewport, selector, options = {}) {
            await send('Emulation.setDeviceMetricsOverride', {
              width: viewport.width,
              height: viewport.height,
              deviceScaleFactor: 1,
              mobile: viewport.mobile,
              screenWidth: viewport.width,
              screenHeight: viewport.height,
            });
            await send('Page.navigate', { url });
            await ready(send);
            if (options.openIndex) await openIndex(send, name);
            if (options.position) await position(send, selector, name);
            await certify(send, selector, name, Boolean(options.mustFit));
            const shot = await send('Page.captureScreenshot', {
              format: 'png',
              fromSurface: true,
              captureBeyondViewport: false,
            });
            const file = path.join(output, `${name}.png`);
            fs.writeFileSync(file, Buffer.from(shot.data, 'base64'));
            const size = fs.statSync(file).size;
            if (size < 12000) throw new Error(`${name} screenshot is suspiciously small (${size} bytes).`);
            console.log(`${name}: ${size} bytes`);
          }

          async function main() {
            const target = await newTarget();
            const socket = await connect(target.webSocketDebuggerUrl);
            const send = installProtocol(socket);
            await send('Page.enable');
            await send('Runtime.enable');

            const desktop = { width: 1600, height: 1000, mobile: false };
            const mobile = { width: 390, height: 844, mobile: true };
            const surfaces = [
              ['home', `${origin}/?reviewTier=full`, '.hero-v4-name', {}],
              ['index', `${origin}/?reviewTier=full`, '.v4-index-destination[data-current="true"]', { openIndex: true, mustFit: true }],
              ['now', `${origin}/?review=now&reviewTier=full`, '#now', { position: true, mustFit: true }],
              ['work', `${origin}/?review=work&reviewTier=full`, '#work', { position: true, mustFit: true }],
              ['growth', `${origin}/?review=growth&reviewTier=full`, '#growth', { position: true, mustFit: true }],
              ['pulse', `${origin}/?review=growth&reviewTier=full`, '.pulse-live, .pulse-zero', { position: true, mustFit: true }],
              ['history', `${origin}/?review=history&reviewTier=full`, '#history', { position: true, mustFit: true }],
              ['history-archive', `${origin}/?review=history&reviewTier=full`, '.history-archive', { position: true, mustFit: true }],
              ['present', `${origin}/?review=present&reviewTier=full`, '#present', { position: true, mustFit: true }],
              ['contact', `${origin}/?review=contact&reviewTier=full`, '#contact', { position: true, mustFit: true }],
              ['zeroupload', `${origin}/work/zeroupload?reviewTier=full`, '.zu-world-hero', { mustFit: true }],
              ['zeroupload-demo', `${origin}/work/zeroupload?reviewTier=full`, '.zu-world-demo-section', { position: true, mustFit: true }],
              ['zeroupload-story', `${origin}/work/zeroupload?reviewTier=full`, '.zu-world-story', { position: true, mustFit: true }],
            ];

            for (const [name, url, selector, options] of surfaces) {
              await capture(send, `${name}-desktop`, url, desktop, selector, options);
            }
            for (const [name, url, selector, options] of surfaces) {
              await capture(send, `${name}-mobile`, url, mobile, selector, options);
            }

            socket.close();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload visual review surfaces
        uses: actions/upload-artifact@v4
        with:
          name: master-2-visual-review
          path: artifacts/visual-review
          if-no-files-found: error
          retention-days: 7
